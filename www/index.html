<!DOCTYPE html>
<html lang="az"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#242428"><title>Kalkulyator</title>
<style>
:root{--screen:#0c0c0d;--or:#ffa20a;--muted:#8a8a90;--mono:ui-monospace,Consolas,monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#242428;color:#fff;font-family:system-ui,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
#app{height:100%;display:flex;flex-direction:column;padding:max(env(safe-area-inset-top),14px) 14px max(env(safe-area-inset-bottom),14px)}
.tabs{display:flex;background:var(--screen);border-radius:14px;padding:3px}
.tabs button{flex:1;border:0;background:none;color:#fff;font-weight:700;font-size:14px;padding:10px;border-radius:11px}
.tabs .on{background:linear-gradient(#ffc14d,#ff9500);color:#1a1a1a}
.page{display:none;flex:1;flex-direction:column;min-height:0}.page.on{display:flex}
.screen{background:var(--screen);border-radius:20px;padding:12px 18px;margin:12px 0;text-align:right;min-height:112px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
#hist{color:var(--muted);font:13px var(--mono);min-height:18px}
#disp{font:300 52px var(--mono);white-space:nowrap}
.keys{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(5,1fr);gap:10px;min-height:0}
.k{position:relative;overflow:hidden;border:0;border-radius:18px;color:#fff;font-size:27px;font-weight:700;background:linear-gradient(#55555a,#37373b);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 3px 6px rgba(0,0,0,.45)}
.k::after{content:"";position:absolute;inset:2px 2px 50% 2px;border-radius:16px 16px 50% 50%;background:linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,0));pointer-events:none}
.k:active{filter:brightness(1.35);transform:scale(.97)}
.fn{background:linear-gradient(#a2a2a8,#6e6e74)}.op{background:linear-gradient(#ffc14d,#ff9500);color:#1a1a1a}.ac{background:linear-gradient(#ff7468,#e0261b)}
.k svg{width:32px;height:32px;vertical-align:middle}
.row{display:flex;gap:8px;margin-top:10px}
select,input{font:inherit;color:#fff;border:0;border-radius:14px;background:linear-gradient(#55555a,#3c3c40);padding:12px;font-weight:700;font-size:16px;min-width:0}
select{flex:1}
input{width:100%;background:var(--screen);font:30px var(--mono);text-align:right;padding:16px 18px;border-radius:18px;outline:0}
.sw{border:0;border-radius:14px;width:52px;font-size:22px;font-weight:700;background:linear-gradient(#ffc14d,#ff9500);color:#1a1a1a}
.card{background:var(--screen);border-radius:18px;padding:22px 12px;margin-top:16px;text-align:center}
.res{font:26px var(--mono);word-break:break-all}.rate{font:12px var(--mono);color:var(--muted);margin-top:8px}
.st{margin-top:auto;text-align:center;color:var(--muted);font-size:12px;padding:8px}
</style></head><body><div id="app">
<div class="tabs"><button class="on" data-p="std">Kalkulyator</button><button data-p="fx">Valyuta</button><button data-p="cr">Kripto</button></div>
<div class="page on" id="std">
 <div class="screen"><div id="hist"></div><div id="disp">0</div></div>
 <div class="keys" id="keys"></div></div>
<div class="page" id="fx"></div><div class="page" id="cr"></div>
</div>
<script>
const FIAT=["AZN","USD","EUR","GBP","TRY","RUB","GEL","CNY","JPY","CHF","CAD","AUD","AED","KZT","UAH","INR","SAR","PLN"];
const CRYPTO={BTC:"bitcoin",ETH:"ethereum",USDT:"tether",BNB:"binancecoin",SOL:"solana",XRP:"ripple",USDC:"usd-coin",ADA:"cardano",DOGE:"dogecoin",TON:"the-open-network",TRX:"tron",LTC:"litecoin"};
const usd={},$=s=>document.querySelector(s);
/* ---- tablar ---- */
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
 document.querySelectorAll(".tabs button,.page").forEach(e=>e.classList.remove("on"));
 b.classList.add("on");$("#"+b.dataset.p).classList.add("on")});
/* ---- adi kalkulyator ---- */
const BS='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M9 5h11v14H9L3 12z"/><path d="M12.5 9.5l5 5m0-5l-5 5"/></svg>';
const KEYS=[["AC","ac"],["±","fn"],["%","fn"],["÷","op"],"7","8","9",["×","op"],"4","5","6",["−","op"],"1","2","3",["+","op"],["⌫","fn"],"0",".",["=","op"]];
let ex="";const OPS="+−×÷";
KEYS.forEach(k=>{const [t,c]=Array.isArray(k)?k:[k,""];const b=document.createElement("button");
 b.className="k "+c;b.innerHTML=t==="⌫"?BS:t;b.onclick=()=>press(t);$("#keys").appendChild(b)});
function show(t){const n=t.length;$("#disp").textContent=t;$("#disp").style.fontSize=(n<=7?52:n<=10?40:n<=14?30:22)+"px"}
function press(k){
 if(k==="AC"){ex="";$("#hist").textContent=""}
 else if(k==="⌫")ex=ex.slice(0,-1);
 else if(k==="=")return eq();
 else if(k==="±"){const m=ex.match(/(\d+\.?\d*|\.\d+)$/);if(m){const s=m.index;
   ex=(s>0&&ex[s-1]==="−"&&(s===1||OPS.includes(ex[s-2])))?ex.slice(0,s-1)+ex.slice(s):ex.slice(0,s)+"−"+ex.slice(s)}}
 else if(OPS.includes(k)){if(!ex&&k!=="−")return;ex=(ex&&OPS.includes(ex.slice(-1)))?ex.slice(0,-1)+k:ex+k}
 else if(k==="%"){if(ex&&/[\d%]$/.test(ex))ex+="%"}
 else if(k==="."){if(!ex.match(/[\d.]*$/)[0].includes("."))ex+=/\d$/.test(ex)?".":"0."}
 else ex+=k;
 show(ex||"0")}
function eq(){if(!ex)return;$("#hist").textContent=ex+" =";
 const s=ex.replace(/÷/g,"/").replace(/×/g,"*").replace(/−/g,"-").replace(/%/g,"/100");
 try{if(!/^[0-9+\-*/.() ]+$/.test(s)||/\*\*/.test(s))throw 0;const v=Function('"use strict";return ('+s+')')();
  if(!isFinite(v)){ex="";return show("Bölmək olmaz")}
  const r=Number.isInteger(v)&&Math.abs(v)<1e15?String(v):String(+v.toPrecision(10));
  ex=r==="0"?"":r.replace("-","−");show(r)}catch(e){ex="";show("Xəta")}}
/* ---- valyuta / kripto ---- */
const fmt=v=>v>=1?v.toLocaleString("en",{minimumFractionDigits:2,maximumFractionDigits:2}):(v.toFixed(8).replace(/0+$/,"").replace(/\.$/,"")||"0");
function mk(id,list,df,dt){const el=$("#"+id),o=list.map(c=>`<option>${c}</option>`).join("");
 el.innerHTML=`<div style="height:12px"></div><input inputmode="decimal" value="1"><div class="row"><select>${o}</select><button class="sw">⇄</button><select>${o}</select></div>
 <div class="card"><div class="res">—</div><div class="rate"></div></div><div class="st">Məzənnələr yüklənir...</div>`;
 const [inp,[a,b]]=[el.querySelector("input"),el.querySelectorAll("select")];a.value=df;b.value=dt;
 const calc=()=>{const x=parseFloat(inp.value.replace(",","."));const r=el.querySelector(".res"),q=el.querySelector(".rate");
  if(isNaN(x)){r.textContent="—";q.textContent="Düzgün rəqəm daxil edin";return}
  if(!usd[a.value]||!usd[b.value]){r.textContent="—";q.textContent="Məzənnə yüklənməyib";return}
  const k=usd[a.value]/usd[b.value];r.textContent=fmt(x*k)+" "+b.value;q.textContent=`1 ${a.value} = ${fmt(k)} ${b.value}`};
 inp.oninput=a.onchange=b.onchange=calc;
 el.querySelector(".sw").onclick=()=>{[a.value,b.value]=[b.value,a.value];calc()};el.calc=calc;return el}
const pages=[mk("fx",FIAT,"USD","AZN"),mk("cr",[...Object.keys(CRYPTO),...FIAT],"BTC","USD")];
async function load(){let ok=false;
 try{const r=(await(await fetch("https://open.er-api.com/v6/latest/USD")).json()).rates;FIAT.forEach(c=>{if(r[c])usd[c]=1/r[c]});ok=true}catch(e){}
 try{const p=await(await fetch("https://api.coingecko.com/api/v3/simple/price?vs_currencies=usd&ids="+Object.values(CRYPTO).join(","))).json();
  for(const s in CRYPTO)if(p[CRYPTO[s]])usd[s]=p[CRYPTO[s]].usd;ok=true}catch(e){}
 const t=ok?"✓ Canlı məzənnələr • "+new Date().toLocaleTimeString():"⚠ İnternet bağlantısını yoxlayın";
 pages.forEach(p=>{p.querySelector(".st").textContent=t;p.calc()})}
load();setInterval(load,60000);
</script></body></html>
